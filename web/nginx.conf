# Одна строка JSON на запрос: docker compose logs --no-log-prefix web | jq -R 'fromjson?'
# $uri, а не $request: в строке запроса бывает токен. requestId тот же, что в логе api
log_format json escape=json '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method","path":"$uri","status":$status,"seconds":$request_time}';

upstream api {
  zone api 64k;
  resolver 127.0.0.11 valid=5s;
  server api:4010 resolve;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log json;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-Id $request_id;

  # Без этого /x.map попал бы в SPA-fallback и получил index.html со статусом 200
  location ~ \.map$ {
    return 404;
  }

  # Какая версия ответила. Значение пишет entrypoint.sh при старте контейнера.
  # merge: без него add_header в location отменил бы этот заголовок
  include /tmp/release.conf;
  add_header_inherit merge;
  add_header X-Release $release always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    try_files $uri @old-assets;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Чанк прошлого релиза лежит в томе. Нет и там — честный 404
  location @old-assets {
    root /srv/releases/public;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location = /version {
    proxy_pass http://api/version;
    add_header Cache-Control "no-store";
  }

  location /api/ {
    proxy_pass http://api/;
    proxy_cookie_path /auth /api/auth;
  }

  location = /api/stream {
    proxy_pass http://api/stream;
    proxy_buffering off;
    proxy_read_timeout 60s;
    gzip off;
    access_log off;
  }
}
