# Вся история на каждый PR и push: pre-commit можно обойти или не включить.
# Отдельный workflow: сканеру не нужны ни node, ни зависимости, поэтому он падает за секунды
name: Secrets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # По умолчанию только последний коммит, а секрет мог уйти раньше
          fetch-depth: 0
          persist-credentials: false
      - name: Поиск секретов
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --no-banner --config .gitleaks.toml .
