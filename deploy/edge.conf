# Входной nginx: один порт на машине, стенд выбирается по имени. Контейнеры стендов пересоздаются при каждой выкатке,
# поэтому адрес перечитывается через DNS Docker, а упавший стенд даёт 502 только у себя.
# Куда идёт стенд, записано в slots/<стенд>.conf: файл пишет агент, переключение — это его замена и nginx -s reload.
# reload не обрывает начатое: старые воркеры дорабатывают свои запросы, новые уже идут в новый слот
include /etc/nginx/slots/*.conf;

# Имя и схема — как у браузера: по ним api сверяет Origin, а cookie остаётся на своём поддомене.
# Буфер выключен: иначе бегущая строка застрянет здесь, хотя за web nginx всё настроено
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_buffering off;
proxy_read_timeout 60s;

server {
  listen 8080 default_server;
  return 404;
}

# Поисковик не должен находить копии сайта: dev и stage просят не индексировать, прод — нет
server {
  listen 8080;
  server_name dev.ofera.localhost;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location / { proxy_pass http://dev; }
}

server {
  listen 8080;
  server_name stage.ofera.localhost;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location / { proxy_pass http://stage; }
}

server {
  listen 8080;
  server_name prod.ofera.localhost;
  location / { proxy_pass http://prod; }
}
