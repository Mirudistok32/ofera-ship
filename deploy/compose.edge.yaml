# Входной nginx всех стендов. Поднимает его агент: npm run ship:agent -- stage. Порт занят — OFERA_EDGE_PORT=8089
name: ofera-edge

services:
  edge:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    labels:
      ofera.ship: "1"
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
      # Каталог, а не файл: агент заменяет файлы переименованием, и привязка к одному файлу осталась бы на старом
      - ./slots:/etc/nginx/slots:ro
    ports:
      - 127.0.0.1:${OFERA_EDGE_PORT:-8088}:8080
    networks:
      - edge
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 1s

networks:
  edge:
    name: ofera-edge
    labels:
      ofera.ship: "1"
