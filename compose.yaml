name: ofera

services:
  api:
    build: ./api
    environment:
      QUEST_ORIGINS: http://localhost:${OFERA_PORT:-8080}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${OFERA_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

volumes:
  data:
