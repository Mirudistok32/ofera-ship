# Свой CDN: nginx с кэшем перед web. Сайт — ofera.localhost, ассеты — cdn.ofera.localhost
# inactive — сколько живёт копия, которую не запрашивают: столько же CDN переживёт и падение origin
proxy_cache_path /tmp/cdn levels=1:2 keys_zone=cdn:10m max_size=256m inactive=7d use_temp_path=off;

upstream origin {
  zone origin 64k;
  # Адрес перечитывается через DNS Docker: у пересозданного контейнера web другой IP
  resolver 127.0.0.11 valid=1s;
  server web:8080 resolve;
}

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Origin лежит или отвечает ошибкой: лучше старая копия, чем 502. Обновляет один запрос, остальные ждут
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_lock on;

server {
  listen 8080 default_server;
  return 404;
}

server {
  listen 8080;
  server_name ofera.localhost;

  # HTML и config.js. Браузеру origin шлёт no-cache и no-store, а такие ответы nginx не хранит.
  # Поэтому заголовок для CDN игнорируем: копия свежа 5 с, затем проверка по ETag, при сбое — stale.
  # Браузер заголовок получает как есть и за свежей копией придёт сюда же
  location / {
    proxy_pass http://origin;
    proxy_cache cdn;
    proxy_ignore_headers Cache-Control;
    proxy_cache_valid 200 5s;
    proxy_cache_revalidate on;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  # API не кэшируется, бегущая строка идёт без буфера
  location /api/ {
    proxy_pass http://origin;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
}

server {
  listen 8080;
  server_name cdn.ofera.localhost;

  # В имени файла хэш, срок задаёт origin: год и immutable. 404 не хранится, nginx кэширует только то, что разрешено
  location /assets/ {
    proxy_pass http://origin;
    proxy_cache cdn;
    proxy_cache_valid 200 30d;
    add_header X-Cache-Status $upstream_cache_status always;
    # Модули и стили подключены с crossorigin: без этого заголовка браузер их не выполнит. Куки здесь нет, поэтому *
    add_header Access-Control-Allow-Origin "*" always;
  }

  location / {
    return 404;
  }
}
