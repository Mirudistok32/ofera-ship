proxy_cache_path /tmp/cdn levels=1:2 keys_zone=cdn:10m max_size=256m inactive=7d use_temp_path=off;

upstream origin {
  zone origin 64k;
  resolver 127.0.0.11 valid=1s;
  server web:8080 resolve;
}

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
  listen 8080 default_server;
  return 404;
}

server {
  listen 8080;
  server_name ofera.localhost;

  # HTML и config.js. Браузеру origin шлёт no-cache и no-store, а такие ответы nginx не хранит.
  # Поэтому заголовок для CDN игнорируем: копия свежа 5 с, затем проверка по ETag.
  # Браузер заголовок получает как есть и за свежей копией придёт сюда же
  location / {
    proxy_pass http://origin;
    proxy_cache cdn;
    proxy_ignore_headers Cache-Control;
    proxy_cache_valid 200 5s;
    proxy_cache_revalidate on;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  location /api/ {
    proxy_pass http://origin;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
}

server {
  listen 8080;
  server_name cdn.ofera.localhost;

  location /assets/ {
    proxy_pass http://origin;
    proxy_cache cdn;
    proxy_cache_valid 200 30d;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location / {
    return 404;
  }
}
