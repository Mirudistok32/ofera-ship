# CDN поверх основного compose: docker compose -f compose.yaml -f compose.cdn.yaml up --build -d
# Сайт — http://ofera.localhost:8090, ассеты — http://cdn.ofera.localhost:8090. Порт занят — OFERA_CDN_PORT=8091
services:
  api:
    environment:
      QUEST_ORIGINS: http://ofera.localhost:${OFERA_CDN_PORT:-8090}
      # Перед api два прокси: cdn и nginx в web
      QUEST_TRUST_PROXY: 2

  web:
    build:
      args:
        ASSET_BASE: http://cdn.ofera.localhost:${OFERA_CDN_PORT:-8090}/
    environment:
      # Сколько последних релизов хранить: столько времени живут старые вкладки и копии HTML
      ASSET_RELEASES: ${ASSET_RELEASES:-3}
    volumes:
      - releases:/srv/releases

  cdn:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    labels:
      ofera.ship: "1"
    volumes:
      - ./cdn/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 127.0.0.1:${OFERA_CDN_PORT:-8090}:8080

volumes:
  releases:
    labels:
      ofera.ship: "1"
